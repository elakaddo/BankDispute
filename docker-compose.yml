services:
  postgres:
    image: postgres:17
    container_name: bankdispute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bankdispute
      POSTGRES_PASSWORD: bankdispute_dev
      POSTGRES_DB: bankdispute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
